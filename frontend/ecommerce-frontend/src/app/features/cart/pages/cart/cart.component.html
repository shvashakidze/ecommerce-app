<div class="max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">კალათა</h1>

  @if (cartService.items().length === 0) {
    <div class="text-center py-20 text-gray-400">
      <p class="text-6xl mb-4">🛒</p>
      <p class="text-xl mb-4">კალათა ცარიელია</p>
      <a routerLink="/products"
         class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
        პროდუქტების ნახვა
      </a>
    </div>
  } @else {
    <div class="space-y-4 mb-6">
      @for (item of cartService.items(); track item.id) {
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 flex items-center gap-4">
          <img [src]="item.imageUrl || 'https://placehold.co/80x80?text=img'"
               class="w-16 h-16 object-cover rounded-lg"/>
          <div class="flex-1">
            <h3 class="font-semibold text-gray-800">{{ item.name }}</h3>
            <p class="text-blue-600 font-bold">{{ item.price | number:'1.2-2' }}₾</p>
          </div>
          <div class="flex items-center gap-3">
            <span class="bg-gray-100 px-3 py-1 rounded-lg font-medium">{{ item.quantity }}</span>
            <button (click)="cartService.removeItem(item.id)"
                    class="text-red-400 hover:text-red-600 text-xl">✕</button>
          </div>
        </div>
      }
    </div>

    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6">
      <div class="flex justify-between items-center mb-6">
        <span class="text-lg font-semibold text-gray-800">სულ:</span>
        <span class="text-2xl font-bold text-blue-600">
          {{ cartService.total() | number:'1.2-2' }}₾
        </span>
      </div>

      <!-- გადახდის მეთოდის არჩევა -->
      <p class="text-sm font-medium text-gray-700 mb-3">გადახდის მეთოდი:</p>
      <div class="grid grid-cols-2 gap-3 mb-5">

        <button (click)="selectProvider('bog')"
                [class]="selectedProvider() === 'bog'
                  ? 'border-2 border-orange-500 bg-orange-50 rounded-xl p-3 flex flex-col items-center gap-1 transition-all'
                  : 'border-2 border-gray-200 bg-white rounded-xl p-3 flex flex-col items-center gap-1 transition-all hover:border-orange-300'">
          <span class="text-2xl">🏦</span>
          <span class="text-xs font-bold text-gray-700">საქართველოს ბანკი</span>
          <span class="text-xs text-gray-400">BOG Pay</span>
          @if (selectedProvider() === 'bog') {
            <span class="text-xs text-orange-500 font-semibold">✓ არჩეულია</span>
          }
        </button>

        <button (click)="selectProvider('tbc')"
                [class]="selectedProvider() === 'tbc'
                  ? 'border-2 border-blue-500 bg-blue-50 rounded-xl p-3 flex flex-col items-center gap-1 transition-all'
                  : 'border-2 border-gray-200 bg-white rounded-xl p-3 flex flex-col items-center gap-1 transition-all hover:border-blue-300'">
          <span class="text-2xl">💳</span>
          <span class="text-xs font-bold text-gray-700">თიბისი ბანკი</span>
          <span class="text-xs text-gray-400">TBC Pay</span>
          @if (selectedProvider() === 'tbc') {
            <span class="text-xs text-blue-500 font-semibold">✓ არჩეულია</span>
          }
        </button>

      </div>

      <!-- გადახდის ღილაკი -->
      <button (click)="checkout()" [disabled]="checkoutLoading"
              [class]="selectedProvider() === 'tbc'
                ? 'w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white py-3 rounded-xl font-semibold hover:opacity-90 disabled:opacity-50 transition-all shadow-md mb-2'
                : 'w-full bg-gradient-to-r from-orange-500 to-orange-600 text-white py-3 rounded-xl font-semibold hover:opacity-90 disabled:opacity-50 transition-all shadow-md mb-2'">
        @if (checkoutLoading) {
          მიმდინარეობს...
        } @else if (selectedProvider() === 'tbc') {
          💳 გადახდა TBC-ით
        } @else {
          🏦 გადახდა BOG-ით
        }
      </button>

      <button (click)="cartService.clear()"
              class="w-full text-gray-400 hover:text-red-500 text-sm py-2">
        კალათის გასუფთავება
      </button>
    </div>
  }
</div>
