<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 via-blue-50 to-purple-50">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-gradient-to-br from-blue-600 to-purple-600 rounded-xl flex items-center justify-center mx-auto mb-3">
        <span class="text-white font-bold text-lg">E</span>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">რეგისტრაცია</h1>
      <p class="text-gray-400 text-sm mt-1">შექმენი ახალი ანგარიში</p>
    </div>

    <!-- Error -->
    @if (error()) {
      <div class="bg-red-50 border border-red-200 text-red-600 rounded-xl p-3 mb-4 text-sm flex items-center gap-2">
        <span>⚠️</span>
        <span>{{ error() }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()">

      <!-- სახელი და გვარი -->
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">სახელი</label>
          <input type="text" [(ngModel)]="firstName" name="firstName" required
                 class="w-full border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-sm"
                 placeholder="შოთა"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">გვარი</label>
          <input type="text" [(ngModel)]="lastName" name="lastName" required
                 class="w-full border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-sm"
                 placeholder="ვაშაკიძე"/>
        </div>
      </div>

      <!-- Email -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" [(ngModel)]="email" name="email" required
               class="w-full border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-sm"
               placeholder="shota@gmail.com"/>
      </div>

      <!-- პაროლი -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">პაროლი</label>
        <input type="password" [(ngModel)]="password" name="password" required
               class="w-full border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-sm"
               placeholder="••••••••"/>
        <p class="text-xs text-gray-400 mt-1">მინიმუმ 6 სიმბოლო</p>
      </div>

      <button type="submit" [disabled]="loading()"
              class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-2.5 rounded-xl hover:opacity-90 font-medium disabled:opacity-50 transition-all shadow-md shadow-blue-200">
        {{ loading() ? 'მიმდინარეობს...' : 'რეგისტრაცია' }}
      </button>

    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
      უკვე გაქვს ანგარიში?
      <a routerLink="/login" class="text-blue-600 hover:underline font-medium">შესვლა</a>
    </p>

  </div>
</div>
